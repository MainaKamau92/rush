name: rush
services:
  app:
    build:
      context: .
      target: runtime
    image: rush:local
    ports:
      - "127.0.0.1:${RUSH_PORT:-8088}:8000"
    volumes:
      - rush-state:/state
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  dev:
    profiles: [tools]
    build:
      context: .
      target: dev
    image: rush-dev:local
    volumes:
      - .:/workspace
    environment:
      RUSH_STATE_DIR: /tmp/rush-test-state
      RUSH_ENVIRONMENT: test
    init: true
volumes:
  rush-state:
