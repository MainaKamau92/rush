name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose build dev
      - run: docker compose run --rm dev ruff format --check .
      - run: docker compose run --rm dev ruff check .
      - run: docker compose run --rm dev mypy
      - run: docker compose run --rm dev python scripts/check_architecture.py
      - run: docker compose run --rm dev lint-imports
      - run: docker compose run --rm dev pylint app

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker compose build dev
      - run: mkdir -p reports
      - run: docker compose run --rm dev pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=json --junitxml=reports/pytest.xml
      - name: Changed executable lines
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: >-
          docker compose run --rm
          -v "$EVENT_PATH:/github-event.json:ro"
          -e GITHUB_EVENT_PATH=/github-event.json
          dev python scripts/check_coverage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            reports/
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker compose build dev
      - run: docker compose run --rm dev bandit -c pyproject.toml -r app scripts
      - run: docker compose run --rm dev pip-audit --strict --disable-pip --no-deps -r requirements/development.txt --progress-spinner off
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks git --redact --no-banner --log-opts=--all .

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose build app
      - run: docker compose run --rm app rush migrate
      - run: docker compose up -d --wait app
      - run: docker compose exec -T app rush health
      - run: docker compose restart app && docker compose up -d --wait app
      - run: docker compose exec -T app rush health
      - if: always()
        run: docker compose logs app && docker compose down

  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/check_conventions.py
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lock and requirement exports agree
        run: sh scripts/lock-dependencies.sh && git diff --exit-code -- uv.lock requirements

  backend-required:
    if: always()
    needs: [quality, tests, security, package, conventions]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - env:
          RUSH_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check_gate.py
